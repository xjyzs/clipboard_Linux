name: 编译并发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(如 v1.0)'
        required: false
        default: ''

permissions:
  contents: write
  actions: write 
jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      APP_NAME: clipboard_Linux
      SCCACHE_DIR: /home/runner/.cache/sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libgl1-mesa-dev \
            libxfixes-dev
            

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 配置 sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: 配置 Cargo 依赖缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-deps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deps-

      - name: 配置 sccache 编译产物缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ runner.os }}-sccache-${{ hashFiles('**/CMakeLists.txt', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-${{ hashFiles('**/CMakeLists.txt', '**/Cargo.lock') }}-
            ${{ runner.os }}-sccache-

      - name: 编译
        env:
          SCCACHE_CACHE_SIZE: "2G"
        run: |
          sccache --start-server
          sccache --zero-stats

          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

          sccache --show-stats

      - name: 打包 Release
        run: |
          set -euo pipefail

          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "${INPUT_VERSION}" ]; then
            VERSION="${INPUT_VERSION}"
          elif [ -n "${GITHUB_REF_NAME}" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="manual"
          fi
          PACKAGE_DIR="${APP_NAME}-${VERSION}-linux-x86_64"
          mkdir -p "${PACKAGE_DIR}"

          APP_BIN="$(find build -maxdepth 3 -type f -name "${APP_NAME}" -print -quit)"
          if [ -z "${APP_BIN}" ]; then
            echo "未能在 build/ 下找到 ${APP_NAME}" >&2
            exit 1
          fi
          cp "${APP_BIN}" "${PACKAGE_DIR}/"

          strip --strip-all "${PACKAGE_DIR}/${APP_NAME}"
          chmod +x "${PACKAGE_DIR}/${APP_NAME}"

          ARCHIVE_NAME="${PACKAGE_DIR}.tar.xz"
          tar -cJf "${ARCHIVE_NAME}" "${PACKAGE_DIR}"

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=${VERSION}" >> "$GITHUB_ENV"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ env.ARCHIVE_NAME }}
          draft: false
          prerelease: false
          body: ${{ github.event.head_commit.message }}